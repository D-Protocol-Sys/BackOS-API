# ==============================================================================
# DOCKER COMPOSE CONFIGURATION: EDGE / REVERSE PROXY LAYER
# Purpose: Single public entrypoint managing incoming HTTP/HTTPS traffic, SSL 
#          certificates, and API protection for all hosted environments.
# Key Features:
#   - Automated SSL certificate management via Let's Encrypt (ACME protocol).
#   - Enforced HTTP-to-HTTPS automatic redirection.
#   - Optional public routes via traefik-dynamic/ (e.g. one generated backend).
# ==============================================================================

version: "3.8"

# ------------------------------------------------------------------------------
# NETWORKS
# Public edge network where proxy and web application entrypoints meet.
# ------------------------------------------------------------------------------
networks:
  # Shared public-facing bridge network used by Traefik to route ingress traffic
  edge:
    name: ${PROJECT_NAME}-edge
    driver: bridge              # Creates an isolated Docker bridge network

# ------------------------------------------------------------------------------
# VOLUMES
# Storage for persistent cryptographic assets.
# ------------------------------------------------------------------------------
volumes:
  # Persistent volume preserving Let's Encrypt certificates across container rebuilds
  traefik_certs:
    name: ${PROJECT_NAME}-traefik-certs

# ------------------------------------------------------------------------------
# SERVICES
# ------------------------------------------------------------------------------
services:

  # ----------------------------------------------------------------------------
  # Edge Reverse Proxy & TLS Termination: Traefik v3.1
  # ----------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: ${PROJECT_NAME}-edge-traefik
    restart: unless-stopped
    
    # Traefik CLI configuration arguments
    command:
      # Provider settings: Dynamic auto-discovery of local Docker containers
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false" # Security: Requires explicit 'traefik.enable=true' label on containers
      - "--providers.docker.network=${PROJECT_NAME}-edge"

      # Entrypoints setup: Defining standard web ports
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"

      # Automatic HTTP -> HTTPS enforcement for all incoming unencrypted traffic
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"

      # Automated Let's Encrypt SSL/TLS resolver setup (ACME HTTP-01 challenge)
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}" # Email used for SSL expiration notices
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json" # Secure storage file for certs

      # File provider (opt-in): routes publiques supplementaires, par exemple exposer UN backend
      # genere (api de portfolio...) via /generated/<slug>/ - voir deploy/traefik-dynamic/ et
      # deploy/traefik-generated-gateway.example.yml. Repertoire vide par defaut = aucun effet.
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"

      # Hardening & Operations
      - "--api.dashboard=false"                     # Security: Disables web UI dashboard to eliminate attack surface
      - "--log.level=WARN"                          # Restricts log output to actionable warning and error events
      
    ports:
      - "80:80"                                     # Public HTTP port mapping
      - "443:443"                                   # Public HTTPS port mapping
      
    volumes:
      - traefik_certs:/letsencrypt                  # Mounts persistent volume for certificates
      - ./traefik-dynamic:/etc/traefik/dynamic:ro   # Routes publiques optionnelles (voir ci-dessus)
      - /var/run/docker.sock:/var/run/docker.sock:ro # Read-only access to Docker socket for container discovery
      
    networks:
      - edge

    # Permet a Traefik de joindre un port publie sur l hote (ex. l orchestrateur LAN sur 4803)
    # pour les routes du repertoire traefik-dynamic/. Integre a Docker Desktop, host-gateway sous Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
      
    security_opt:
      - "no-new-privileges:true"                     # Restricts container processes from gaining escalated root permissions
      
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      
    deploy:
      resources:
        limits:
          cpus: "0.50"                              # Caps CPU usage at 0.5 cores
          memory: 256M                              # Enforces 256MB RAM consumption limit

  # ----------------------------------------------------------------------------
  # NOTE - le Docker Socket Proxy n est PLUS dans cette pile.
  # Tout conteneur relie au reseau partage "edge" (la demo publique comprise) pouvait l atteindre
  # par son nom (docker-proxy:2375) : c etait un chemin reseau reel vers l API Docker de l hote,
  # meme sans DOCKER_HOST. Chaque pile qui a VRAIMENT besoin de Docker (prod, lan) embarque
  # maintenant son propre proxy sur un reseau prive "docker_api" que ni edge ni demo ne voient.
  # ----------------------------------------------------------------------------
