services:
  backos-postgres:
    image: postgres:16-alpine
    container_name: backos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: backos_user
      POSTGRES_PASSWORD: backos_password
      POSTGRES_DB: backos_db
    ports:
      - "5432:5432"
    volumes:
      - backos_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backos_user -d backos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backos-redis:
    image: redis:7-alpine
    container_name: backos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  
