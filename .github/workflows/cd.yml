# ============================================================================
# PIPELINE OVERVIEW: Continuous Deployment (CD)
# This workflow automates building, scanning, signing, and deploying container 
# images following DevSecOps best practices.
#
# TO USE THIS ON YOUR OWN FORK (nothing to edit in this file) - Settings > Secrets and variables:
#   Secrets   : DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH   (SSH access to your server,
#               DEPLOY_PATH = folder where the repository is cloned)
#               GHCR_USER + GHCR_TOKEN   (only if the image package is private: a token with
#               "read:packages", used by the server to pull the image)
#   Variables : DEMO_URL and/or PROD_URL   (public base URL, e.g. https://demo.example.com)
# Without them the deploy jobs are skipped with a warning (the image is still built and pushed).
# Full walkthrough: docs/README_DEPLOIEMENT.md, section "CI/CD".
# ============================================================================

name: CD

# ----------------------------------------------------------------------------
# TRIGGERS
# Defines the events that automatically or manually start this workflow.
# ----------------------------------------------------------------------------
on:
  push:
    branches: [main]        # Trigger automatically whenever code is pushed to 'main'
    tags: ["v*.*.*"]        # Trigger automatically when a semantic version tag is created (e.g., v1.0.0)
  
  workflow_dispatch:        # Allows manual execution directly from the GitHub Actions Web UI
    inputs:
      deploy_prod:
        description: "Also deploy to PROD (otherwise: demo only)"
        type: boolean
        default: false

# ----------------------------------------------------------------------------
# SECURITY: Global Permissions (Least Privilege Principle)
# Setting top-level permissions to empty ensures that no job gets automatic
# write access unless explicitly granted within the job configuration.
# ----------------------------------------------------------------------------
permissions: {}

# ----------------------------------------------------------------------------
# ENVIRONMENT VARIABLES
# Reusable variables available across all jobs in this workflow.
# ----------------------------------------------------------------------------
env:
  REGISTRY: ghcr.io                  # GitHub Container Registry endpoint
  IMAGE_NAME: ${{ github.repository }} # Automatically uses 'owner/repository-name'

jobs:

  # ============================================================================
  # JOB 1: Build, Scan, Sign, and Publish Container Image
  # ============================================================================
  build-and-push:
    name: Build, scan, sign, push
    runs-on: ubuntu-latest            # Runs on GitHub's hosted Linux runner
    
    # Granular permissions required ONLY for this specific job
    permissions:
      contents: read                  # Required to checkout code repository
      packages: write                 # Required to push images to GitHub Container Registry
      id-token: write                 # Required for OIDC authentication (keyless signing with Cosign)
      security-events: write          # Required to upload security scan results to GitHub

    # Outputs make values generated in this job accessible to subsequent jobs
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      # Step 1: Download repository source code to the runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # Registry image names must be lowercase; a GitHub account/repo name may contain capitals.
      - name: Compute lowercase image name
        run: echo "IMAGE_NAME=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # Step 2: Initialize Docker Buildx for advanced build capabilities (caching, multi-platform)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Authenticate against the GitHub Container Registry using the auto-generated GITHUB_TOKEN
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Generate standardized tags and labels based on git metadata (commit SHA, semver tag)
      - id: meta
        name: Extract Docker metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Step 5: Build image with layer caching and push to registry
      - id: build
        name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .                  # Build context root directory
          file: deploy/Dockerfile     # Path to custom Dockerfile
          target: runtime             # Multi-stage target stage to keep runtime image minimal
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true            # Generates build provenance attestation (SLSA compliance)
          sbom: true                  # Generates Software Bill of Materials (track dependencies)
          cache-from: type=gha        # Pull cached layers from GitHub Actions cache
          cache-to: type=gha,mode=max # Store all build stages in GitHub Actions cache

      # Step 6: Scan the published image for vulnerability vulnerabilities (CVEs)
      - name: Scan container image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: sarif               # Standard format for static analysis security results
          output: trivy-published.sarif
          severity: CRITICAL,HIGH     # Only report critical and high severity flaws

      # Step 7: Upload scan report to GitHub Security dashboard (always run even if previous steps fail)
      - name: Upload vulnerability scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()                  # Ensures report is uploaded even if vulnerabilities are found
        with:
          sarif_file: trivy-published.sarif

      # Step 8: Install Cosign CLI tool for artifact signing
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Step 9: Cryptographically sign the image using keyless OIDC authentication
      - name: Sign container image
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}

  # ============================================================================
  # JOB 2: Continuous Deployment to DEMO (Reusable Call)
  # ============================================================================
  deploy-demo:
    name: Deploy -> DEMO
    needs: build-and-push            # Explicit dependency: wait for build-and-push job completion
    if: github.ref == 'refs/heads/main' # Execute only on main branch pushes
    
    # Calls an external reusable workflow file to avoid repeating deployment logic
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: demo              # Targets the GitHub Environment named 'demo'
      target_url: ${{ vars.DEMO_URL }}          # Repository variable (Settings > Variables)
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
      env_file: .env.demo
      health_check_url: ${{ vars.DEMO_URL }}/api/health
    secrets: inherit                 # Automatically pass secrets to the child workflow

  # ============================================================================
  # JOB 3: Controlled Deployment to PRODUCTION
  # ============================================================================
  deploy-prod:
    name: Deploy -> PROD
    needs: [build-and-push, deploy-demo] # Sequential dependency: run only after build and demo deploy pass
    
    # Run only on official version release tags OR if manually triggered with the prod flag enabled.
    # The explicit result checks matter: on a tag push the demo job is SKIPPED (it only runs on
    # 'main'), and a job whose dependency was skipped is skipped too unless its condition says
    # otherwise - without this, tagging a release never deployed to production.
    if: >-
      ${{ !cancelled()
      && needs.build-and-push.result == 'success'
      && (needs.deploy-demo.result == 'success' || needs.deploy-demo.result == 'skipped')
      && (startsWith(github.ref, 'refs/tags/v') || inputs.deploy_prod == true) }}
    
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: production        # Targets the GitHub Environment named 'production' (can require manual approvals)
      target_url: ${{ vars.PROD_URL }}          # Repository variable (Settings > Variables)
      image_tag: ${{ needs.build-and-push.outputs.image_tag }}
      env_file: .env.production
      health_check_url: ${{ vars.PROD_URL }}/api/health
    secrets: inherit